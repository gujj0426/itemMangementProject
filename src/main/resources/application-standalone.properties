# ========================================
# PDF \u8BA2\u5355\u8F6C\u6362\u5668 - \u72EC\u7ACB\u7248\u914D\u7F6E\u6587\u4EF6
# ========================================

# \u8DEF\u5F84\u914D\u7F6E\uFF08\u4F7F\u7528\u76F8\u5BF9\u8DEF\u5F84\uFF0C\u652F\u6301\u4EFB\u610F\u89E3\u538B\u4F4D\u7F6E\uFF09
app.pdf.input-folder=./file/pdf_input
app.pdf.bak-folder=./file/pdf_bakup
app.excel.output-folder=./file/excel_output

# Excel \u6587\u4EF6\u914D\u7F6E
app.excel.filename-prefix=cufflinksDetails
app.excel.max-files-per-day=99
app.excel.sheet-name=orderDtails

# \u521D\u59CB\u5E8F\u53F7\u914D\u7F6E
app.excel.initial-index=1

# \u4EA7\u54C1\u540D\u79F0\u6620\u5C04\u914D\u7F6E\u6587\u4EF6
app.mapping.product-name-file=product-name-mapping.properties

# ========================================
# \u65E5\u5FD7\u914D\u7F6E
# ========================================
# \u6CE8\u610F\uFF1A\u8BE6\u7EC6\u65E5\u5FD7\u914D\u7F6E\u5DF2\u5728 logback-spring.xml \u4E2D\u8BBE\u7F6E
# \u8FD9\u91CC\u53EA\u8BBE\u7F6E\u65E5\u5FD7\u6587\u4EF6\u8DEF\u5F84
logging.file.name=./logs/pdf-converter.log

# ========================================
# \u5B57\u7B26\u7F16\u7801\u914D\u7F6E
# ========================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ========================================
# \u5B9A\u65F6\u4EFB\u52A1\u914D\u7F6E
# ========================================
# \u9ED8\u8BA4\u6BCF\u5206\u949F\u68C0\u67E5\u4E00\u6B21\u65B0\u6587\u4EF6
scheduler.cron=0 * * * * ?

# \u5176\u4ED6\u914D\u7F6E\u9009\u9879\uFF1A
# - \u6BCF5\u79D2\uFF1A0/5 * * * * ?
# - \u6BCF10\u79D2\uFF1A0/10 * * * * ?
# - \u6BCF5\u5206\u949F\uFF1A0 */5 * * * ?
# - \u6BCF\u5C0F\u65F6\uFF1A0 0 * * * ?

# ============================================
# 附属商品补充规则配置
# ============================================
# 格式：<规则键>=<主商品类型>|<条件>|<附属商品类型>|<附属商品中文名称>
#
# 字段说明：
# - 规则键：唯一标识
# - 主商品类型：触发规则的主商品类型
# - 条件：补充条件（如 没有BOX）
# - 附属商品类型：要补充的附属商品类型
# - 附属商品中文名称：附属商品的中文名称（从 product-chinese-name-mapping.properties 查询）
# ============================================

accessory.rule.tie.clip=Tie Clip|没有BOX|长方形礼盒|长方形礼盒
accessory.rule.tie.clip.slide=Slide on Tie Clip|没有BOX|长方形礼盒|长方形礼盒

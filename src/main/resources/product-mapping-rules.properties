# ============================================
# 商品标题映射配置文件
# ============================================
# 说明：此文件用于配置商品标题到主商品类型的映射关系
# 格式：<配置键>=<商品标题>|<主商品类型>|<附加规则条件>
#
# 字段说明：
# - 配置键：唯一标识，用于引用该配置（如 tie.clip.1, cufflinks.1）
# - 商品标题：Voro店铺的商品标题，支持模糊匹配（可使用部分关键词）
# - 主商品类型：内部使用的主商品类型标识（如 Slide on Tie Clip, Tie Clip, Cufflinks）
# - 附加规则条件：补充附属商品的条件描述（如 商品中没有BOX，则附加一个长方形礼盒）
#
# 注意：商品中文名称请使用 product-chinese-name-mapping.properties 配置
# ============================================

# 领带夹系列
tie.clip.1=Custom Engraved Tie Clip with Woodbox- 2 Sides Handwriting|Slide on Tie Clip|商品中没有BOX，则附加一个长方形礼盒
tie.clip.2=Tie Clip with woodbox, Stainless Steel Groomsmen Gift|Tie Clip|商品中没有BOX，则附加一个长方形礼盒

# 组合商品系列（需要根据Item Options确定）
combo.1=Pet Portrait Cufflinks and Tie Clip Set with woodbox|Tie Clip or Cufflinks|商品中没有BOX，主商品是袖扣，则附加一个小方形礼盒、主商品是鸭嘴领带夹则附加一个长方形礼盒

# ============================================
# 商品中文名称映射配置文件
# ============================================
# 说明：此文件用于配置主商品中文名称的映射规则
# 格式：<配置键>=<主商品类型>|<型号>|<颜色>|<产品变量>|<主商品中文名称>
#
# 字段说明：
# - 配置键：唯一标识（如 tie.clip.slide.1, cufflinks.s.silver）
# - 主商品类型：内部使用的主商品类型标识
# - 型号：S, L 等，空表示不限制
# - 颜色：银色、金色、玫瑰金、黑色等，空表示不限制
# - 产品变量：如 Square Box, Oval Box 等，空表示不限制
# - 主商品中文名称：映射后的中文名称
# 
# 匹配规则：按配置顺序从上到下匹配，找到第一个符合所有条件的规则即返回
# ============================================

# 领带夹系列
tie.clip.slide=Slide on Tie Clip|||双面划入领带夹
tie.clip.standard=Tie Clip|||鸭嘴领带夹（薄）

# 袖扣系列 - S型号
cufflinks.s.silver=Cufflinks|S|银色||旧款袖扣
cufflinks.s.gold=Cufflinks|S|金色||旧款袖扣
cufflinks.s.rose=Cufflinks|S|玫瑰金||旧款袖扣
cufflinks.s.black=Cufflinks|S|黑色||旧款袖扣

# 袖扣系列 - L型号
cufflinks.l.rose=Cufflinks|L|玫瑰金||旧款袖扣
cufflinks.l.black=Cufflinks|L|黑色||旧款袖扣
cufflinks.l.silver=Cufflinks|L|银色||单抛袖扣-过渡
cufflinks.l.gold=Cufflinks|L|金色||单抛袖扣-过渡

# 通用袖扣（不限制型号和颜色）
cufflinks.general=Cufflinks||||旧款袖扣

# 心形相盒
necklace.heart=Birth Flower Heart Necklace|||花卉心形相盒吊坠

# 包装盒系列
box.square=BOX||Square Box-方形木盒|包装盒
box.rectangle=BOX||Box-长方形木盒|包装盒
box.oval=BOX||Oval Box-椭圆形开窗木盒|包装盒

# 通用包装盒
box.general=BOX||||包装盒

# ============================================
# 产品尺寸映射配置文件
# ============================================
# 说明：将订单中的原始尺寸字符串映射为 ProductSize 枚举名称
# 格式：原始值=枚举名称（必须与ProductSize枚举的name()匹配）
# ============================================

# === 标准字母尺寸（精确映射到枚举name） ===
XL=XL
XXL=XL
XS=S
SM=SM
S=S
M=M
L=L

# === 英文单词尺寸（部分匹配，按长度优先） ===
xlarge=XL
xsmall=S
small=S
medium=M
large=L

# 路径配置
app.pdf.input-folder=${inputPath}
app.pdf.bak-folder=${bakPath}
app.excel.output-folder=${outputPath}

app.excel.filename-prefix=cufflinksDetails
app.excel.max-files-per-day=99
app.excel.sheet-name=orderDtails
# 初始序号配置
app.excel.initial-index=1
# 产品名称映射配置文件
app.mapping.product-name-file=product-name-mapping.properties

# 字符编码配置
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

app.ocr.language=eng
# 定时任务配置
scheduler.cron=0 * * * * ?

# 附属商品补充规则配置
# 规则1：袖扣/领带夹 补充包装盒
accessory.rules[0].description=袖扣或领带夹补充包装盒
accessory.rules[0].main-product-types=旧款袖扣,领带夹
accessory.rules[0].exclude-product-types=包装盒
accessory.rules[0].title-keywords=
accessory.rules[0].accessory-product-type=包装盒
accessory.rules[0].quantity-same-as-main=true
accessory.rules[0].inherit-color=false
accessory.rules[0].inherit-size=false

# 规则2：花卉心形相盒吊坠 补充基础链
accessory.rules[1].description=花卉心形相盒吊坠补充基础链
accessory.rules[1].main-product-types=
accessory.rules[1].exclude-product-types=
accessory.rules[1].title-keywords=birth flower,heart necklace,flower heart
accessory.rules[1].accessory-product-type=基础链
accessory.rules[1].quantity-same-as-main=true
accessory.rules[1].inherit-color=true
accessory.rules[1].inherit-size=false


# 路径配置
app.pdf.input-folder=${inputPath:./pdf_input}
app.pdf.bak-folder=${bakPath:./pdf_bak}
app.excel.output-folder=${outputPath:./excel_output}

# Excel配置
app.excel.filename-prefix=orderDetails
app.excel.max-files-per-day=99
app.excel.sheet-name=details
app.excel.max-rows-per-file=6000
app.excel.initial-index=1

# 产品名称映射配置文件
app.mapping.product-name-file=product-name-mapping.properties

# 配置文件
app.config.attribute-labels-file=product-attribute-labels.json
app.config.attribute-semantics-file=attribute-label-semantics.json
app.config.product-list-file=产品清单.csv
app.config.addon-rules-file=addon-rules.properties
app.config.accessory-rules-file=accessory-rules.json

# 配置模板管理
# 基线 Excel 文件路径（含所有 Listing 和附加规则的基线配置）
# 默认在 jar 同级目录下查找 dataBase.xlsx，启动时可通过 --database-file 参数覆盖
app.config.database-file=${databaseFile:./dataBase.xlsx}

# 字符编码配置
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

app.ocr.language=eng
# 定时任务配置
scheduler.cron=0 * * * * ?


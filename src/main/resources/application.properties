# 路径配置
app.pdf.input-folder=${inputPath:./pdf_input}
app.pdf.bak-folder=${bakPath:./pdf_bak}
app.excel.output-folder=${outputPath:./excel_output}

# Excel配置
app.excel.filename-prefix=orderDetails
app.excel.max-files-per-day=99
app.excel.sheet-name=details
app.excel.max-rows-per-file=6000
app.excel.initial-index=1

# 产品名称映射配置文件
app.mapping.product-name-file=product-name-mapping.properties

# 配置文件
app.config.attribute-labels-file=product-attribute-labels.json
app.config.attribute-semantics-file=attribute-label-semantics.json
app.config.product-list-file=产品清单.csv
app.config.addon-rules-file=addon-rules.properties
app.config.accessory-rules-file=accessory-rules.json

# 配置模板管理
# 基线 Excel 文件路径（含所有 Listing 和附加规则的基线配置）
# 默认在 jar 同级目录下查找 dataBase.xlsx，启动时可通过 --database-file 参数覆盖
app.config.database-file=${databaseFile:./dataBase.xlsx}

# 字符编码配置
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

app.ocr.language=eng
# 定时任务配置
scheduler.cron=0 * * * * ?

# DeepSeek：Personalization 意图抽取（默认关闭；开启需配置 DEEPSEEK_API_KEY）
app.llm.personalization.enabled=true
app.llm.personalization.api-key=${DEEPSEEK_API_KEY:}
app.llm.personalization.base-url=https://api.deepseek.com
# Flash 成本低、速度快；双面 Front/Back、附图混合刻录等复杂语义更易出错时可改用 deepseek-chat / deepseek-reasoner（以控制台为准）。
app.llm.personalization.model=deepseek-v4-flash
# app.llm.personalization.model=deepseek-chat
app.llm.personalization.timeout-ms=60000
# 过小易导致长刻录 JSON 输出被截断；可与路由叠加时注意费用
app.llm.personalization.max-tokens=2048
# fill-empty-only：仅当规则未解析出风格/字体时用 LLM；overlay：LLM 非空时覆盖 Excel 列
app.llm.personalization.merge-policy=fill-empty-only
# 空 JSON 或缺省列表时，允许值自动取自 style-name-mapping / font-name-mapping 的标准名
app.llm.personalization.canonical-lists-file=personalization-canonical-lists.json

# 可选：两阶段路由。代码已对检出 Front/Back(Bar) 的留言跳过路由以免丢弃背面；其余过长留言仍可受益。
app.llm.personalization.routing-enabled=true
app.llm.personalization.routing-model=
app.llm.personalization.routing-max-tokens=1024
app.llm.personalization.routing-min-personalization-chars=40


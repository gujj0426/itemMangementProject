# ============================================
# 商品标题识别规则配置文件
# ============================================
# 说明：此文件用于通过商品标题中的关键字识别商品名称和产品大类
# 格式：<配置键>=<关键字列表(用逗号分隔)>|<产品名称>|<产品大类>|<是否组合产品标识>
# 字段说明：
# - 配置键：唯一标识，用于引用该配置
# - 关键字列表：商品标题中需要包含的关键字，多个关键字用逗号分隔（必须全部匹配）
# - 产品名称：具体的产品名称（对应 ProductName 枚举的 nameCode）Tie Clip Double Sided Slide In
# - 产品大类：产品的所属大类（对应 OrderType 枚举的 displayName 或 name）Tie Clip
# - 是否组合产品标识：true表示组合产品，false表示非组合产品 组合产品的意思是这个listing中一次购买多个商品
#                  比如：袖扣+领带夹+椭圆形开窗木盒
# ============================================

# 领带夹类 - 单独双面滑入领带夹，Slide on Tie Clip
tie.clip.slide.1=slide on,tie clip|Tie Clip Double Sided Slide In|Tie Clip|false
tie.clip.slide.2=custom engraved,tie clip,woodbox,handwriting|Tie Clip Double Sided Slide In|Tie Clip|false


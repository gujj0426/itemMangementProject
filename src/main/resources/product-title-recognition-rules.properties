# ============================================
# 商品标题识别规则配置文件
# ============================================
# 说明：此文件用于通过商品标题中的关键字识别商品名称和产品大类
# 格式：<配置键>=<关键字列表(用逗号分隔)>|<产品名称>|<产品大类>|<是否组合产品标识>|<listingId>
# 字段说明：
# - 配置键：唯一标识，用于引用该配置
# - 关键字列表：商品标题中需要包含的关键字，多个关键字用逗号分隔（必须全部匹配）
# - 产品名称：具体的产品名称（对应 ProductName 枚举的 nameCode）
# - 产品大类：产品的所属大类（对应 OrderType 枚举的 displayName 或 name）
# - 是否组合产品标识：true表示组合产品，false表示非组合产品
# - listingId：listing标识（每个listing必须唯一，不能多个listing公用）
# ============================================


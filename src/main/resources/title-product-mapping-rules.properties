# ============================================
# 商品标题映射配置文件
# ============================================
# 说明：此文件用于配置商品标题到主商品类型的映射关系
# 格式：<配置键>=<商品标题>|<主商品类型>
#
# 字段说明：
# - 配置键：唯一标识，用于引用该配置（如 tie.clip.1, cufflinks.1）
# - 商品标题：Voro店铺的商品标题，支持模糊匹配（可使用部分关键词）
# - 主商品类型：内部使用的主商品类型标识（如 Slide on Tie Clip, Tie Clip, Cufflinks）
# ============================================


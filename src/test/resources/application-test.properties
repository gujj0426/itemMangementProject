# Regression / integration tests: avoid background scheduler firing during context startup
spring.task.scheduling.enabled=false
spring.main.banner-mode=off

# Keep IO under target/ during tests (scheduler still logs paths at startup if any)
app.pdf.input-folder=${java.io.tmpdir}/pdf-regression-in
app.pdf.bak-folder=${java.io.tmpdir}/pdf-regression-bak
app.excel.output-folder=${java.io.tmpdir}/pdf-regression-out

app.llm.personalization.enabled=false
